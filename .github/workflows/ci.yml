name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  UV_LINK_MODE: copy

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and package build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          python-version: "3.11"
          enable-cache: true

      - name: Install locked development environment
        run: uv sync --frozen --extra dev

      - name: Lint
        run: uv run --frozen --no-sync ruff check .

      - name: Check formatting
        run: uv run --frozen --no-sync ruff format --check .

      - name: Check types
        run: uv run --frozen --no-sync mypy src tests

      - name: Run tests
        run: uv run --frozen --no-sync pytest -q

      - name: Build distributions
        run: uv build --no-build-isolation
