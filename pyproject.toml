[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "financial-assistant"
version = "0.1.0"
description = "Auditable Vietnamese financial-report question answering."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "bm25s>=0.2.9,<1",
    "duckdb>=1.1,<2",
    "faiss-cpu>=1.9,<2",
    "httpx>=0.28,<1",
    "huggingface-hub>=1.2,<2",
    "networkx>=3.4,<4",
    "numpy>=1.26,<3",
    "orjson>=3.10,<4",
    "pandas>=2.2,<4",
    "pdfplumber>=0.11,<1",
    "pillow>=11,<13",
    "pyarrow>=18,<25",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pymupdf>=1.25,<2",
    "pypdf>=5,<7",
    "pyyaml>=6,<7",
    "rapidfuzz>=3.10,<4",
    "sentence-transformers>=3.4,<6",
    "streamlit>=1.41,<2",
]

[project.scripts]
financial-report-qa = "financial_report_qa.cli:main"
normalization-audit = "financial_report_qa.evaluation.normalization_audit_cli:main"

[project.optional-dependencies]
dev = [
    "hatchling==1.31.0",
    "hypothesis>=6.120,<7",
    "jupyterlab>=4.4,<5",
    "matplotlib>=3.10,<4",
    "mypy>=1.14,<2",
    "nbformat>=5.10,<6",
    "pandas-stubs>=2.3,<4",
    "pre-commit>=4,<5",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
]
ocr = [
    "paddleocr>=3,<4",
    "paddlepaddle>=3,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
cache_dir = ".cache/pytest"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]
# Exploratory notebooks and historical planning documents are not production
# sources: ruff formats Python code blocks inside Markdown, which would churn
# already-published design docs for no benefit.
extend-exclude = ["*.ipynb", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["financial_report_qa"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.hatch.build.targets.wheel]
packages = ["src/financial_report_qa"]
