repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run ruff check .
        language: system
        pass_filenames: false
      - id: ruff-format-check
        name: Ruff format check
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy strict
        entry: uv run mypy src
        language: system
        pass_filenames: false
      - id: pytest-fast
        name: pytest
        entry: uv run pytest -q -p no:cacheprovider
        language: system
        pass_filenames: false
