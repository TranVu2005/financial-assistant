repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --frozen --no-sync ruff check .
        language: system
        pass_filenames: false
      - id: ruff-format-check
        name: Ruff format check
        entry: uv run --frozen --no-sync ruff format --check .
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy strict
        entry: uv run --frozen --no-sync mypy src tests
        language: system
        pass_filenames: false
      - id: pytest-fast
        name: pytest unit
        entry: uv run --frozen --no-sync pytest -q tests/unit
        language: system
        pass_filenames: false
